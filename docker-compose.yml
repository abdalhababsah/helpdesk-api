services:
  mysql:
    image: mysql:8.0
    container_name: helpdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: helpdesk
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - helpdesk-mysql:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP. During init MySQL runs a temporary socket-only
      # server, so a socket ping reports healthy before the real server exists.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches every outgoing email. Open http://localhost:8025 to read them.
  # Point the API at it with MAIL_MAILER=smtp and MAIL_PORT=1025.
  mailpit:
    image: axllent/mailpit
    container_name: helpdesk-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  helpdesk-mysql:
